openapi: 3.1.0
info:
  title: Smart Campus Access Policy API
  version: 1.0.0
  description: |
    Contract-first API for Pair 10: Access Gate calls Core Business in real time
    to check access policy before opening a campus gate.
  contact:
    name: FIT4110 Lab 02 Team
    email: fit4110@example.edu.vn
servers:
  - url: http://localhost:4010
    description: Prism mock server
  - url: https://api.smart-campus.local
    description: Smart Campus internal network
tags:
  - name: health
    description: Service health status.
  - name: access-checks
    description: Real-time access policy decisions.
  - name: policies
    description: Access policy lookup.
  - name: decisions
    description: Audit lookup for previous access decisions.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service health
      description: Returns current availability information for Core Business policy checks.
      tags: [health]
      security: []
      responses:
        '200':
          description: Service is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                ok:
                  value:
                    status: ok
                    service: core-business-access-policy
                    checkedAt: '2026-05-18T06:00:00Z'

  /access/check:
    post:
      operationId: checkAccessPolicy
      summary: Check access policy
      description: |
        Access Gate sends one card or QR credential swipe to Core Business.
        Core Business returns an allow or deny decision that the gate can apply immediately.
      tags: [access-checks]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessCheckRequest'
            examples:
              cardSwipe:
                value:
                  gateId: GATE-A-01
                  campusId: CAMPUS-HCM
                  occurredAt: '2026-05-18T06:01:30Z'
                  direction: ENTRY
                  subject:
                    credentialType: CARD
                    cardId: CARD-2026-0001
                    holderId: STUDENT-10001
                  device:
                    deviceId: READER-A-01
                    firmwareVersion: 2.4.1
                  note: null
              qrScan:
                value:
                  gateId: GATE-B-02
                  campusId: CAMPUS-HCM
                  occurredAt: '2026-05-18T06:05:10Z'
                  direction: EXIT
                  subject:
                    credentialType: QR
                    qrTokenHash: sha256:2ccfd7f1a8f20b1d
                    holderId: VISITOR-5521
                    validUntil: '2026-05-18T10:00:00Z'
                  device:
                    deviceId: QR-READER-B-02
                    firmwareVersion: 1.9.0
                  note: Visitor leaving campus
      responses:
        '200':
          description: Policy decision created.
          headers:
            X-Decision-Source:
              description: Indicates whether the decision came from live policy evaluation or cache.
              schema:
                type: string
                enum: [LIVE, CACHE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDecision'
              examples:
                allow:
                  value:
                    decisionId: dec_01HY5WR0W4F8M9CBR1Q2D3Z4AA
                    allow: true
                    reasonCode: POLICY_ALLOW
                    reasonMessage: Card holder is active and allowed for this gate.
                    policyId: pol_access_student_main_gate
                    gateId: GATE-A-01
                    subjectId: STUDENT-10001
                    evaluatedAt: '2026-05-18T06:01:31Z'
                    expiresAt: '2026-05-18T06:02:01Z'
                    correlationId: corr-20260518-0001
                deny:
                  value:
                    decisionId: dec_01HY5WR2WTW7QXGBB6S7E8N9CC
                    allow: false
                    reasonCode: CARD_BLOCKED
                    reasonMessage: Card is blocked by current campus policy.
                    policyId: pol_access_blocked_cards
                    gateId: GATE-A-01
                    subjectId: STUDENT-10002
                    evaluatedAt: '2026-05-18T06:02:00Z'
                    expiresAt: null
                    correlationId: corr-20260518-0002
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /policies/access/{policyId}:
    get:
      operationId: getAccessPolicy
      summary: Get access policy
      description: Returns the policy referenced by a decision so Access Gate can audit the result.
      tags: [policies]
      parameters:
        - $ref: '#/components/parameters/PolicyId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Access policy detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicy'
              examples:
                studentMainGate:
                  value:
                    policyId: pol_access_student_main_gate
                    name: Student main gate access
                    status: ACTIVE
                    priority: 100
                    allowedDirections: [ENTRY, EXIT]
                    allowedGateIds: [GATE-A-01, GATE-A-02]
                    validFrom: '2026-01-01T00:00:00Z'
                    validUntil: null
                    updatedAt: '2026-05-10T08:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /decisions/{decisionId}:
    get:
      operationId: getAccessDecision
      summary: Get access decision
      description: Returns a previous decision for audit, retry reconciliation, or gate incident review.
      tags: [decisions]
      parameters:
        - $ref: '#/components/parameters/DecisionId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Access decision detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDecision'
              examples:
                allow:
                  value:
                    decisionId: dec_01HY5WR0W4F8M9CBR1Q2D3Z4AA
                    allow: true
                    reasonCode: POLICY_ALLOW
                    reasonMessage: Card holder is active and allowed for this gate.
                    policyId: pol_access_student_main_gate
                    gateId: GATE-A-01
                    subjectId: STUDENT-10001
                    evaluatedAt: '2026-05-18T06:01:31Z'
                    expiresAt: '2026-05-18T06:02:01Z'
                    correlationId: corr-20260518-0001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /decisions/recent:
    get:
      operationId: listRecentAccessDecisions
      summary: List recent access decisions
      description: Returns recent access decisions for gate reconciliation and operational monitoring.
      tags: [decisions]
      parameters:
        - $ref: '#/components/parameters/GateIdQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Recent decisions page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDecisionPage'
              examples:
                firstPage:
                  value:
                    items:
                      - decisionId: dec_01HY5WR0W4F8M9CBR1Q2D3Z4AA
                        allow: true
                        reasonCode: POLICY_ALLOW
                        reasonMessage: Card holder is active and allowed for this gate.
                        policyId: pol_access_student_main_gate
                        gateId: GATE-A-01
                        subjectId: STUDENT-10001
                        evaluatedAt: '2026-05-18T06:01:31Z'
                        expiresAt: '2026-05-18T06:02:01Z'
                        correlationId: corr-20260518-0001
                    nextCursor: null
                    hasMore: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Correlation id used for tracing a gate transaction across services.
      schema:
        type: string
        minLength: 8
        maxLength: 80
      example: corr-20260518-0001
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for one gate swipe or scan, used to prevent duplicate decisions on retry.
      schema:
        type: string
        minLength: 12
        maxLength: 120
      example: idem-GATE-A-01-20260518-0001
    PolicyId:
      name: policyId
      in: path
      required: true
      description: Stable identifier of an access policy.
      schema:
        type: string
        pattern: '^pol_[a-z0-9_]+$'
      example: pol_access_student_main_gate
    DecisionId:
      name: decisionId
      in: path
      required: true
      description: Stable identifier of an access decision.
      schema:
        type: string
        pattern: '^dec_[A-Z0-9]{26}$'
      example: dec_01HY5WR0W4F8M9CBR1Q2D3Z4AA
    GateIdQuery:
      name: gateId
      in: query
      required: false
      description: Filter decisions by gate id.
      schema:
        type: string
        minLength: 3
        maxLength: 40
      example: GATE-A-01
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor returned from the previous page.
      schema:
        type: [string, 'null']
        minLength: 1
        maxLength: 200

  responses:
    BadRequest:
      description: Request is not valid JSON or does not match the schema.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidJson:
              value:
                type: https://api.smart-campus.local/problems/bad-request
                title: Bad Request
                status: 400
                detail: Request body is malformed or missing a required field.
                instance: /access/check
                correlationId: corr-20260518-0001
    Unauthorized:
      description: Bearer token is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Caller is authenticated but cannot access this resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Idempotency key conflicts with a different access check payload.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Request is syntactically valid but violates business rules.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Unexpected provider error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, service, checkedAt]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
        checkedAt:
          type: string
          format: date-time

    AccessCheckRequest:
      type: object
      additionalProperties: false
      required: [gateId, campusId, occurredAt, direction, subject, device]
      properties:
        gateId:
          type: string
          minLength: 3
          maxLength: 40
        campusId:
          type: string
          minLength: 3
          maxLength: 40
        occurredAt:
          type: string
          format: date-time
        direction:
          $ref: '#/components/schemas/AccessDirection'
        subject:
          $ref: '#/components/schemas/AccessSubject'
        device:
          $ref: '#/components/schemas/GateDevice'
        note:
          type: [string, 'null']
          maxLength: 500

    AccessSubject:
      oneOf:
        - $ref: '#/components/schemas/CardCredentialSubject'
        - $ref: '#/components/schemas/QrCredentialSubject'
      discriminator:
        propertyName: credentialType
        mapping:
          CARD: '#/components/schemas/CardCredentialSubject'
          QR: '#/components/schemas/QrCredentialSubject'

    CardCredentialSubject:
      type: object
      additionalProperties: false
      required: [credentialType, cardId]
      properties:
        credentialType:
          type: string
          const: CARD
        cardId:
          type: string
          minLength: 4
          maxLength: 60
        holderId:
          type: [string, 'null']
          minLength: 3
          maxLength: 60

    QrCredentialSubject:
      type: object
      additionalProperties: false
      required: [credentialType, qrTokenHash, validUntil]
      properties:
        credentialType:
          type: string
          const: QR
        qrTokenHash:
          type: string
          minLength: 12
          maxLength: 120
        holderId:
          type: [string, 'null']
          minLength: 3
          maxLength: 60
        validUntil:
          type: string
          format: date-time

    GateDevice:
      type: object
      additionalProperties: false
      required: [deviceId, firmwareVersion]
      properties:
        deviceId:
          type: string
          minLength: 3
          maxLength: 60
        firmwareVersion:
          type: string
          minLength: 1
          maxLength: 30

    AccessDecision:
      type: object
      additionalProperties: false
      required:
        - decisionId
        - allow
        - reasonCode
        - reasonMessage
        - policyId
        - gateId
        - subjectId
        - evaluatedAt
        - expiresAt
        - correlationId
      properties:
        decisionId:
          type: string
          pattern: '^dec_[A-Z0-9]{26}$'
        allow:
          type: boolean
        reasonCode:
          $ref: '#/components/schemas/DecisionReasonCode'
        reasonMessage:
          type: string
          minLength: 1
          maxLength: 300
        policyId:
          type: string
          pattern: '^pol_[a-z0-9_]+$'
        gateId:
          type: string
          minLength: 3
          maxLength: 40
        subjectId:
          type: [string, 'null']
          minLength: 3
          maxLength: 60
        evaluatedAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        correlationId:
          type: string
          minLength: 8
          maxLength: 80

    AccessDecisionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AccessDecision'
        nextCursor:
          type: [string, 'null']
          maxLength: 200
        hasMore:
          type: boolean

    AccessPolicy:
      type: object
      additionalProperties: false
      required:
        - policyId
        - name
        - status
        - priority
        - allowedDirections
        - allowedGateIds
        - validFrom
        - validUntil
        - updatedAt
      properties:
        policyId:
          type: string
          pattern: '^pol_[a-z0-9_]+$'
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
        priority:
          type: integer
          minimum: 1
          maximum: 1000
        allowedDirections:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AccessDirection'
        allowedGateIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AccessDirection:
      type: string
      enum: [ENTRY, EXIT]

    DecisionReasonCode:
      type: string
      enum:
        - POLICY_ALLOW
        - POLICY_DENY
        - CARD_BLOCKED
        - QR_EXPIRED
        - GATE_NOT_ALLOWED
        - OUTSIDE_ALLOWED_TIME
        - POLICY_UNAVAILABLE

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: [string, 'null']
        errors:
          type: [array, 'null']
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
